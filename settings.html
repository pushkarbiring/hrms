<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM Portal - Settings Configuration</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div>
                <div class="logo-area">HRM Portal</div>
                <nav class="nav-menu">
                    <a href="payroll.html" class="nav-item">Payroll Status</a>
                    <a href="reports.html" class="nav-item">Reports Matrix</a>
                    <a href="notifications.html" class="nav-item">Alert Workspace</a>
                    <a href="profile.html" class="nav-item">My Profile</a>
                    <a href="settings.html" class="nav-item active">Settings Layout</a>
                </nav>
            </div>
            <div class="user-tag">Logged in as: <span>HR Accountant</span></div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Global Parameters & Account Settings</h1>
            </header>

            <div class="settings-stack">
                <div class="card">
                    <h2>Personal Display Theme Options</h2>
                    <div class="form-group">
                        <label class="toggle-switch-wrapper">
                            <input type="checkbox" id="themeToggle">
                            <span class="sliding-rail"></span>
                            Enable Workspace Dark Mode Layer
                        </label>
                    </div>
                </div>

                <div class="card">
                    <h2>Password Registry Protection</h2>
                    <!-- Implementing the global .form-input class -->
                    <form class="settings-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="currentPassword">Current Access Key</label>
                            <input type="password" id="currentPassword" class="form-input" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">Target Next Access Key Structure</label>
                            <input type="password" id="newPassword" class="form-input" placeholder="Minimum 8 components">
                        </div>
                        <button type="button" class="btn btn-primary" style="margin-top: 12px; max-width: 250px;">Update Security Values</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/settings.js"></script>
</body>
</html>
