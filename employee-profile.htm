<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile - HRMS</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>
    <div class="container">
        <h2>Employee Profile</h2>
        
        <div class="profile-card">
            <div class="profile-header">
                <img id="profilePicDisplay" src="default-avatar.png" alt="Profile Picture">
                <input type="file" id="profilePicUpload" accept="image/*">
                </div>

            <form id="profileForm">
                <h3>Personal Details</h3>
                <label>Name:</label>
                <input type="text" id="empName" disabled>
                
                <label>Address:</label>
                <input type="text" id="empAddress"> <label>Phone:</label>
                <input type="text" id="empPhone"> <label>Emergency Contact:</label>
                <input type="text" id="empEmergency">

                <h3>Job Details</h3>
                <label>Department:</label>
                <select id="empDepartment" disabled></select>
                
                <label>Skills:</label>
                <input type="text" id="empSkills">
                
                <label>Experience (Years):</label>
                <input type="number" id="empExperience">

                <button type="submit" id="saveProfileBtn">Save Changes</button>
            </form>
        </div>
    </div>

    <script type="module" src="employee.js"></script>
</body>
</html>
