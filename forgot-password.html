<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Premium HRMS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-layout">

    <main class="auth-container">
        <div class="card auth-card">

            <div class="auth-header">
                <div class="brand-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>HRMS</span>
                </div>
                <h1>Reset Password</h1>
                <p class="text-muted">Enter your work email and we'll send you a link to reset your password.</p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" class="form-input" placeholder="name@company.com" required
                        autocomplete="email">
                </div>

                <button type="submit" class="btn btn-primary full-width" id="reset-btn">
                    <span id="btn-text">Send Reset Link</span>
                    <span id="btn-loader" style="display: none;">Sending...</span>
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-muted"><a href="index.html" class="back-link">← Back to Sign In</a></p>
            </div>

        </div>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>

</body>

</html>
