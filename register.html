<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Premium HRMS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-layout">
    
    <main class="auth-container">
        <div class="card auth-card">
            
            <div class="auth-header">
                <div class="brand-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>HRMS</span>
                </div>
                <h1>Create an account</h1>
                <p class="text-muted">Enter your details to join the workspace</p>
            </div>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="John Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="empId">Employee ID</label>
                    <input type="text" id="empId" class="form-input" placeholder="EMP-001" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" class="form-input" placeholder="name@company.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required autocomplete="new-password">
                    <small class="text-muted" style="display: block; margin-top: 4px; font-size: 12px;">Must be at least 8 characters long.</small>
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" class="form-input" required>
                        <option value="" disabled selected>Select your role...</option>
                        <option value="employee">Employee</option>
                        <option value="admin">Admin / HR Officer</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary full-width" id="register-btn">
                    <span id="btn-text">Create Account</span>
                    <span id="btn-loader" style="display: none;">Registering...</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="text-muted">Already have an account? <a href="index.html">Sign in</a></p>
            </div>
            
        </div>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    
</body>
</html>
