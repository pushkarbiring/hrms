                    <circle cx="9" cy="7" r="4"></circle>

                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>

            </div>
        </div>

        <nav class="sidebar-nav">
            <p class="nav-label">Main Menu</p>
            <a href="dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="employees.html" class="nav-item admin-only" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>
                </svg>
                <span>Employees</span>
            </a>
            <a href="attendance.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Attendance</span>
            </a>
            <a href="leave.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Leave Requests</span>
            </a>
            <a href="payroll.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <div class="sidebar-footer">
            <button id="logout-btn" class="nav-item text-danger"
                style="background: none; border: none; width: 100%; text-align: left; cursor: pointer;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>

                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Log Out</span>
            </button>
        </div>
    </aside>

    <main class="main-content">

        <header class="top-navbar">
            <div class="navbar-left">
                <button class="icon-btn mobile-menu-toggle" id="menu-toggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h2 class="page-title">Leave Requests</h2>
            </div>

            <div class="navbar-right">
                <button class="icon-btn notification-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge">3</span>
                </button>
                <div class="user-profile">
                    <div class="avatar">
                        <span id="nav-avatar-initials">--</span>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="nav-user-name">Loading...</span>
                        <span class="user-role" id="nav-user-role">...</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-container">

            <div class="approval-list-container">
                <div class="card approval-row">
                    <div class="applicant-info">
                        <div class="avatar-circle">JM</div>
                        <div class="applicant-meta">
                            <h4>Justin Mason</h4>
                            <p>Paid Time Off Request &bull; July 12 to July 16 (5 Days) &bull; Reason: Personal Travel</p>
                        </div>
                    </div>
                    <div class="action-button-group">
                        <button class="btn btn-deny" onclick="alert('Request Denied.')">Decline</button>
                        <button class="btn btn-approve" onclick="alert('Request Approved.')">Approve</button>
                    </div>
                </div>

                <div class="card approval-row">
                    <div class="applicant-info">
                        <div class="avatar-circle">CZ</div>
                        <div class="applicant-meta">
                            <h4>Clara Zheng</h4>
                            <p>Medical Emergency Sick Leave &bull; July 08 (1 Day) &bull; Reason: Medical Screening</p>
                        </div>
                    </div>
                    <div class="action-button-group">
                        <button class="btn btn-deny" onclick="alert('Request Denied.')">Decline</button>
                        <button class="btn btn-approve" onclick="alert('Request Approved.')">Approve</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
